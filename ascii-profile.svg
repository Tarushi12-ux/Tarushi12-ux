<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 320" width="350" height="320">
<defs>

        <style>
            .bg { fill: #0d1117; rx: 8px; ry: 8px; }
            .card-border { stroke: #30363d; stroke-width: 1px; fill: none; rx: 8px; ry: 8px; }
            .title-bar { fill: #161b22; rx: 8px; ry: 8px; }
            .dot-red { fill: #ff5f56; }
            .dot-yellow { fill: #ffbd2e; }
            .dot-green { fill: #27c93f; }
            .title-text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; fill: #8b949e; }
            
            .ascii-text {
                font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
                font-size: 8px;
                fill: #39d353;
                white-space: pre;
                letter-spacing: 1px;
            }
            .placeholder-text {
                font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
                font-size: 11px;
                fill: #8b949e;
                white-space: pre;
            }
            .highlight-green { fill: #39d353; font-weight: bold; }
            .highlight-blue { fill: #58a6ff; }

            /* CRITICAL FIX: opacity defaults to 1 so SVG renders instantly on GitHub */
            .row { opacity: 1; animation: rowFadeIn 0.3s ease-out; }
            @keyframes rowFadeIn {
                from { opacity: 0.3; transform: translateY(2px); }
                to { opacity: 1; transform: translateY(0); }
            }
        </style>
    
</defs>
<rect class="bg" width="350" height="320" />
<rect class="card-border" width="349" height="319" x="0.5" y="0.5" />
<rect class="title-bar" width="350" height="28" />
<circle cx="16" cy="14" r="4.5" class="dot-red" />
<circle cx="28" cy="14" r="4.5" class="dot-yellow" />
<circle cx="40" cy="14" r="4.5" class="dot-green" />
<text x="54" y="18" class="title-text">photo-module.sh</text>
<text x="18" y="56" class="placeholder-text row" style="animation-delay: 0.04s;">┌──────────────────────────────────────┐</text>
<text x="18" y="74" class="placeholder-text highlight-green row" style="animation-delay: 0.07s;">│  [ PHOTO_MODULE ]                    │</text>
<text x="18" y="92" class="placeholder-text highlight-green row" style="animation-delay: 0.1s;">│  status : awaiting_input             │</text>
<text x="18" y="110" class="placeholder-text highlight-blue row" style="animation-delay: 0.13s;">│  mode   : terminal_ascii_v2          │</text>
<text x="18" y="128" class="placeholder-text row" style="animation-delay: 0.16s;">├──────────────────────────────────────┤</text>
<text x="18" y="146" class="placeholder-text row" style="animation-delay: 0.19s;">│                                      │</text>
<text x="18" y="164" class="placeholder-text row" style="animation-delay: 0.22s;">│     • Place photo in assets/         │</text>
<text x="18" y="182" class="placeholder-text row" style="animation-delay: 0.25s;">│     • Run scripts/prep_photo.py      │</text>
<text x="18" y="200" class="placeholder-text row" style="animation-delay: 0.28s;">│     • Run scripts/make_ascii_svg.py  │</text>
<text x="18" y="218" class="placeholder-text row" style="animation-delay: 0.31s;">│                                      │</text>
<text x="18" y="236" class="placeholder-text row" style="animation-delay: 0.34s;">└──────────────────────────────────────┘</text>
</svg>